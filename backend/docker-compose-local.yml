services:
  postgres:
    image: postgres:16
    container_name: pawprint-postgres
    environment:
      POSTGRES_DB: pawprintdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pawprint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d pawprintdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pawprint-postgres-data:
