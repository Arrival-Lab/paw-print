server:
  forward-headers-strategy: native

spring:
  main:
    lazy-initialization: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      # RDS 가 잠깐 끊겼다 살아나는 경우 dead connection 자동 폐기.
      # connection-test-query 로 매 borrow 시 ping → 죽었으면 새로 만들어 옴.
      # max-lifetime 으로 오래된 connection 주기적 교체 (RDS idle disconnect 회피).
      connection-test-query: SELECT 1
      validation-timeout: 3000
      keepalive-time: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
        provider:
          google:
            issuer-uri: https://accounts.google.com

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 86400000
  refresh-expiration: 2592000000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

gemini:
  api-key: ${GEMINI_API_KEY}
  # 모델 deprecation 시 코드 변경 없이 환경변수만 수정. 2026-05 기준 gemini-1.5-flash 가 v1beta 에서 404.
  # dear-m-i 백엔드에서 검증된 gemini-2.5-flash 채택.
  model: ${GEMINI_MODEL:gemini-2.5-flash}

aws:
  s3:
    bucket: pawprint-files
    region: ap-northeast-2
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    cdn-domain: ${AWS_S3_CDN_DOMAIN:}     # CloudFront 배포 도메인. 비어있으면 S3 직접 URL fallback.

kakao:
  api-key: ${KAKAO_API_KEY}

weather:
  provider: ${WEATHER_PROVIDER:kma}
  kma:
    service-key: ${KMA_SERVICE_KEY:}
  keco:
    service-key: ${KECO_SERVICE_KEY:}

firebase:
  credentials-path: ${FCM_SERVICE_ACCOUNT_KEY:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  play:
    credentials-path: ${PLAY_DEVELOPER_API_JSON:}
    package-name: com.arrivallab.pawprint

apple:
  team-id: RNB85R7469
  key-id: ${APPLE_KEY_ID:}
  key-path: ${APPLE_KEY_PATH:}
  bundle-id: com.arrivallab.pawprint
  shared-secret: ${APPLE_SHARED_SECRET:}

logging:
  level:
    root: INFO
    com.arrivallab.pawprint: INFO
    org.springframework.security: WARN
