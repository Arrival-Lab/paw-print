spring:
  application:
    name: pawprint

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA 공통 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # 멀티파트 업로드 한도 — 펫 사진/처방전/다이어리 사진 10MB 까지 허용 (앱 측 한도와 동기화)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
