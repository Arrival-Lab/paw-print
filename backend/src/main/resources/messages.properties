# 기본(한국어) 메시지 번들. Accept-Language 미지원/누락 시 이 파일이 fallback.
# error.<ErrorCode 이름> = BusinessException 메시지. 키 누락 시 ErrorCode 의 한국어 기본값으로 폴백.

# 공통
error.internal=서버 내부 오류가 발생했어요. 잠시 후 다시 시도해주세요.
security.unauthenticated=인증이 필요합니다.

# 402 - Premium
error.PREMIUM_REQUIRED=프리미엄 구독이 필요한 기능입니다.
error.PET_LIMIT_EXCEEDED=무료 플랜은 최대 3마리까지 등록 가능합니다.
error.OCR_LIMIT_EXCEEDED=무료 플랜은 월 5회까지 OCR을 사용할 수 있습니다.
error.AI_CHECK_LIMIT_EXCEEDED=무료 플랜은 월 5회까지 AI 증상 체크를 사용할 수 있습니다.
error.ATTACHMENT_LIMIT_EXCEEDED=무료 플랜은 사진을 건당 5장까지 첨부할 수 있습니다.
error.PHOTO_LIMIT_EXCEEDED=무료 플랜은 사진을 건당 5장까지 첨부할 수 있습니다.
error.VACCINE_ALERT_LIMIT_EXCEEDED=무료 플랜은 예방접종 알림을 3개까지 설정할 수 있습니다.
error.SHARE_LIMIT_EXCEEDED=무료 플랜은 1명까지 공유할 수 있습니다.

# 400 - Bad Request
error.FILE_TOO_LARGE=파일 크기는 10MB를 초과할 수 없습니다.
error.INVALID_FILE_TYPE=지원하지 않는 파일 형식입니다.
error.INVALID_INPUT=입력값이 올바르지 않습니다.
error.INVALID_NICKNAME=닉네임은 2~20자, 한글·영문·숫자만 사용할 수 있어요.
error.NICKNAME_DUPLICATED=이미 사용 중인 닉네임이에요.
error.NICKNAME_REQUIRED=닉네임을 먼저 설정해 주세요.
error.PURCHASE_VERIFICATION_FAILED=결제 검증에 실패했습니다.

# 401 - Unauthorized
error.UNAUTHORIZED=로그인이 필요합니다.
error.INVALID_TOKEN=유효하지 않은 토큰입니다.
error.EXPIRED_TOKEN=만료된 토큰입니다.

# 403 - Forbidden
error.FORBIDDEN=접근 권한이 없습니다.

# 404 - Not Found
error.NOT_FOUND=리소스를 찾을 수 없습니다.
error.USER_NOT_FOUND=사용자를 찾을 수 없습니다.
error.PET_NOT_FOUND=반려동물을 찾을 수 없습니다.
error.RECORD_NOT_FOUND=진료기록을 찾을 수 없습니다.
